services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memory_with_receipts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memory_with_receipts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
